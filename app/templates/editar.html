<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Jogo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 600px;">
    <h1 class="h2 mb-4">✏️ Editar Jogo</h1>

    <div class="card shadow-sm">
        <div class="card-body">
            <form action="/jogos/{{ jogo.id }}/editar" method="post">
                <div class="mb-3">
                    <label class="form-label">Título</label>
                    <input type="text" name="titulo" class="form-control" value="{{ jogo.titulo }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Plataforma</label>
                    <input type="text" name="plataforma" class="form-control" value="{{ jogo.plataforma }}" required>
                </div>
                <div class="form-check mb-3">
                    <input type="checkbox" name="concluido" class="form-check-input" id="concluido" {% if jogo.concluido %}checked{% endif %}>
                    <label class="form-check-label" for="concluido">Zerado</label>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Salvar</button>
                    <a href="/" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
